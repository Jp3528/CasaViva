<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CasaViva Ecommerce Preview</title>
  <desc id="desc">Portfolio cover for a home ecommerce system with catalog, checkout, admin panel and API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e7efe6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5efe6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#233020" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1056" cy="126" r="140" fill="#d7e6d2" opacity="0.72"/>
  <circle cx="170" cy="610" r="190" fill="#ead8bd" opacity="0.62"/>
  <rect x="90" y="84" width="1100" height="552" rx="36" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="124" y="122" width="288" height="50" rx="25" fill="#263425"/>
  <text x="154" y="155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">CasaViva</text>
  <text x="124" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700" fill="#20201e">Sistema ecommerce</text>
  <text x="124" y="303" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#53634b">Hogar, catalogo, carrito, checkout y panel admin.</text>
  <g transform="translate(124 370)">
    <rect width="210" height="112" rx="22" fill="#ffffff" stroke="#e4dac9"/>
    <text x="26" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#20201e">Catalogo</text>
    <text x="26" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#697365">Productos y filtros</text>
  </g>
  <g transform="translate(360 370)">
    <rect width="210" height="112" rx="22" fill="#ffffff" stroke="#e4dac9"/>
    <text x="26" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#20201e">Checkout</text>
    <text x="26" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#697365">Pedidos y cupones</text>
  </g>
  <g transform="translate(596 370)">
    <rect width="210" height="112" rx="22" fill="#ffffff" stroke="#e4dac9"/>
    <text x="26" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#20201e">API REST</text>
    <text x="26" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#697365">Node, Express, SQL</text>
  </g>
  <g transform="translate(832 370)">
    <rect width="210" height="112" rx="22" fill="#ffffff" stroke="#e4dac9"/>
    <text x="26" y="48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#20201e">Admin</text>
    <text x="26" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#697365">Inventario y ventas</text>
  </g>
  <rect x="124" y="534" width="298" height="48" rx="24" fill="#53634b"/>
  <text x="152" y="565" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">React + TypeScript + PostgreSQL</text>
  <path d="M960 156c64 22 103 74 103 142 0 91-72 153-164 153-76 0-136-43-161-108" fill="none" stroke="#c45e3d" stroke-width="18" stroke-linecap="round" opacity=".36"/>
</svg>
